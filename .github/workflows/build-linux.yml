name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  tag:
  workflow_dispatch:

jobs:
  build-linux:
    name: ${{ matrix.project }} linux-${{ matrix.arch.name }}
    runs-on: ${{ matrix.arch.runner }}
    strategy:
      fail-fast: false
      matrix:
        project:
          - "BasiliskII"
          - "SheepShaver"
        arch:
          - name: "x86_64"
            runner: "ubuntu-26.04"
          - name: "arm64"
            runner: "ubuntu-26.04-arm"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
                
      - name: Install required packages
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential automake pkg-config \
            libsdl3-dev libvhdi-dev libgtk-3-dev \
            libgmp3-dev libmpfr-dev

      - name: Build
        shell: bash
        run: |
          cd ${{ matrix.project }}/src/Unix
          ./autogen.sh \
            --with-sdl3 --enable-sdl-video --enable-sdl-audio \
            --with-bincue
          make -j$(nproc)

      - name: Store build as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.project }}-linux-${{ matrix.arch.name }}
          path: ${{ matrix.project }}/src/Unix/${{ matrix.project }}
